["ResourcefulShulker Config"]
	# The total of aura given by absorber with one shulker. Prefer to have a multiple of 32
	# Default: 4096
	# Range: > 0
	absorber_aura = 4096
	# Enable the protection of Generating Box against time in a bottle
	tiab_protection = true
	# Enable the auto generation of recipes for custom shulkers
	generate_recipes = true
	# The amount of aura required to keep entity on infuser without AI
	# Default: 100
	# Range: > 0
	no_ai_aura = 100
	# The base amount of items generated by a box. Amount is calculated with: base + (nb_upgrades * modifier)
	# Default: 1
	# Range: 0 ~ 64
	base_generation_amount = 1
	# The modifier for each quantity upgrade
	# Default: 2
	# Range: > 0
	quantity_upgrade_modifier = 2
	# The base amount of durability restored by a shulker shell. Amount is calculated with: base * (nb_upgrades * modifier)
	# Warning: The shell is consumed only if the box is missing at least the amount of durability restored by the shell
	# Default: 4
	# Range: 0 ~ 64
	base_shell_durability = 4
	# The modifier for each shell upgrade
	# Default: 0.5
	# Range: 0.0 ~ 1.7976931348623157E308
	shell_upgrade_modifier = 0.5
